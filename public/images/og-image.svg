<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14" />
      <stop offset="50%" stop-color="#15171E" />
      <stop offset="100%" stop-color="#1E120A" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE7113" />
      <stop offset="100%" stop-color="#FC5C03" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232733" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1A1D26" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Orange Glow Orbs -->
  <circle cx="1050" cy="150" r="220" fill="#FC5C03" opacity="0.18" filter="url(#glow)"/>
  <circle cx="150" cy="500" r="180" fill="#FE7113" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" stroke="#2B303C" stroke-width="2" fill="none"/>

  <!-- Left Content Area -->
  <g transform="translate(80, 100)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="230" height="38" rx="19" fill="#FC5C03" fill-opacity="0.15" stroke="#FC5C03" stroke-width="1.5"/>
    <text x="24" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FE7113" letter-spacing="1">BANGLADESH'S #1 STORE</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      AI <tspan fill="url(#primaryGrad)">Haat</tspan>
    </text>

    <text x="0" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#F3F4F6">
      Premium Digital Products &amp; Software
    </text>

    <!-- Description -->
    <text x="0" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#9CA3AF">
      Instant Automatic Delivery • Genuine Subscriptions • 100% Replacement Warranty
    </text>
    <text x="0" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#9CA3AF">
      ChatGPT Plus, Claude Pro, Midjourney, Windows 11 Keys, VPNs &amp; Developer Tools
    </text>

    <!-- Trust Badges -->
    <g transform="translate(0, 320)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="190" height="50" rx="14" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <circle cx="28" cy="25" r="10" fill="#10B981" fill-opacity="0.2"/>
      <path d="M24 25L27 28L33 22" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#E5E7EB">Instant Delivery</text>

      <!-- Badge 2 -->
      <rect x="206" y="0" width="190" height="50" rx="14" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <circle cx="234" cy="25" r="10" fill="#FC5C03" fill-opacity="0.2"/>
      <path d="M230 25L233 28L239 22" stroke="#FC5C03" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="254" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#E5E7EB">bKash &amp; Nagad</text>

      <!-- Badge 3 -->
      <rect x="412" y="0" width="200" height="50" rx="14" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <circle cx="440" cy="25" r="10" fill="#3B82F6" fill-opacity="0.2"/>
      <path d="M436 25L439 28L445 22" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="460" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#E5E7EB">Full Warranty</text>
    </g>
  </g>

  <!-- Right Graphic Area -->
  <g transform="translate(860, 180)">
    <!-- Central Badge -->
    <rect x="0" y="0" width="240" height="240" rx="40" fill="url(#cardGrad)" stroke="#FC5C03" stroke-width="2"/>
    <circle cx="120" cy="120" r="85" fill="#FFFFFF" fill-opacity="0.05"/>
    <!-- Stylized AH Monogram -->
    <path d="M75 160L108 80H126L158 160H140L131 138H102L93 160H75Z" fill="#FFFFFF"/>
    <path d="M117 102L127 125H106L117 102Z" fill="#15171E"/>
    <path d="M125 118H165V132H145V160H130V132H125V118Z" fill="url(#primaryGrad)"/>
    <text x="120" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FE7113" letter-spacing="2">aihaat.shop</text>
  </g>
</svg>